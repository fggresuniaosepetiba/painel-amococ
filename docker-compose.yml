# Infraestrutura local do Painel AMOCOC (Fase 1).
# Produção usa Neon trocando apenas a DATABASE_URL — nenhum serviço novo aqui.
services:
  postgres:
    image: postgres:16-alpine
    container_name: amococ-postgres
    restart: unless-stopped
    ports:
      # Porta do host parametrizável (default 5432 da spec): quando outro
      # Postgres ocupa a 5432 (ex.: serviço nativo sem permissão p/ `net stop`),
      # subir com POSTGRES_HOST_PORT=5433 e ajustar o DATABASE_URL local.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amococ}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amococ_dev}
      POSTGRES_DB: ${POSTGRES_DB:-amococ}
    volumes:
      - amococ-postgres-data:/var/lib/postgresql/data

volumes:
  amococ-postgres-data:

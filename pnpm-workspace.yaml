packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true

# pnpm 11: configurações do workspace vivem neste arquivo (não mais em package.json).
# Aprova o script de build do esbuild (binário nativo usado pelo Vite).
onlyBuiltDependencies:
  - esbuild
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
